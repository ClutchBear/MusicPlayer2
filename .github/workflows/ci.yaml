name: CI
# Controls when the action will run.
# Events list: https://docs.github.com/en/actions/reference/events-that-trigger-workflows
# on: [push, pull_request, workflow_dispatch]
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-x64:
    runs-on: windows-2022   # windows-latest 已换 VS2026-only 镜像，v143 MFC 装不进去（MSB8041），钉死 VS2022 镜像
    permissions:
      contents: write   #创建 Release 需要 GITHUB_TOKEN 有写权限
    steps:
      - name: Check Out
        uses: actions/checkout@v4
      # 所有版本链接：https://docs.microsoft.com/en-us/visualstudio/releases/2022/release-history
      - name: 下载 vs_enterprise.exe
        run: Invoke-WebRequest "https://aka.ms/vs/17/release/vs_enterprise.exe" -OutFile vs_enterprise.exe
      # 组件列表：https://docs.microsoft.com/en-us/visualstudio/install/workload-component-id-vs-enterprise?view=vs-2022
      # 命令行选项：https://docs.microsoft.com/en-us/visualstudio/install/use-command-line-parameters-to-install-visual-studio?view=vs-2022
      - name: 安装需要的组件
        run: |
          Start-Process -Wait vs_enterprise.exe -ArgumentList "--quiet", "--force", "--norestart", `
          "--add", "Microsoft.VisualStudio.Component.VC.CoreIde", `
          "--add", "Microsoft.VisualStudio.Component.IntelliCode", `
          "--add", "Microsoft.VisualStudio.Component.Windows10SDK", `
          "--add", "Microsoft.Component.VC.Runtime.UCRTSDK", `
          "--add", "Microsoft.VisualStudio.Component.VC.ATL", `
          "--add", "Microsoft.VisualStudio.Component.VC.ATLMFC", `
          "--add", "Microsoft.VisualStudio.Component.VC.14.29.16.11.MFC"
      - name: 设置 msbuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'   # 强制用 VS2022 的 msbuild：项目是 v143 工具集，VS2026(v18) 没有 v143 的 MFC 库（MSB8041）
      - name: 编译
        run: msbuild -t:Build '-p:Configuration=Release;platform=x64' -m:4
      - name: 上传编译产物（Artifacts，供手动运行时下载）
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer2.x64
          path: ./x64/Release/MusicPlayer2.exe
      - name: 创建 Release（仅 tag 推送时触发）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 以官方最新 Release 的 x64 包为底包（含 bass/bass_fx/Encoder/Plugins/skins 等非编译产物），
          # 仅替换 MusicPlayer2.exe 为本次构建产物，包结构与官方完全一致
          $rel = Invoke-RestMethod "https://api.github.com/repos/zhongyang219/MusicPlayer2/releases/latest"
          $asset = $rel.assets | Where-Object { $_.name -like "*x64.zip" } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile official_x64.zip
          7z x official_x64.zip -opkg -y
          $exeDir = (Get-ChildItem pkg -Recurse -Filter MusicPlayer2.exe | Select-Object -First 1).DirectoryName
          Copy-Item ./x64/Release/MusicPlayer2.exe "$exeDir/MusicPlayer2.exe" -Force
          # 注入自定义皮肤：紫色主题配置 + 背景图
          Copy-Item ./skin_config/config.ini "$exeDir/config.ini" -Force
          Copy-Item ./skin_config/purple_myth.png "$exeDir/purple_myth.png" -Force
          Push-Location pkg
          $name = Split-Path $exeDir -Leaf
          7z a -mx9 "..\MusicPlayer2-x64-$env:GITHUB_REF_NAME.zip" $name
          Pop-Location
          # x64/x86 两个任务并发，Release 只建一次，后来者改为追加附件
          if (-not (gh release view "$env:GITHUB_REF_NAME" 2>$null)) {
            gh release create "$env:GITHUB_REF_NAME" "MusicPlayer2-x64-$env:GITHUB_REF_NAME.zip" --title "MusicPlayer2 $env:GITHUB_REF_NAME" --notes "基于官方最新底包，替换 exe 为自定义构建（炫紫神话皮肤）。" || gh release upload "$env:GITHUB_REF_NAME" "MusicPlayer2-x64-$env:GITHUB_REF_NAME.zip" --clobber
          } else {
            gh release upload "$env:GITHUB_REF_NAME" "MusicPlayer2-x64-$env:GITHUB_REF_NAME.zip" --clobber
          }
  build-x86:
    runs-on: windows-2022   # 同上：钉死 VS2022 镜像
    permissions:
      contents: write   #同 x64：创建/上传 Release 需要 GITHUB_TOKEN 有写权限
    steps:
      - name: Check Out
        uses: actions/checkout@v4
      # 所有版本链接：https://docs.microsoft.com/en-us/visualstudio/releases/2022/release-history
      - name: 下载 vs_enterprise.exe
        run: Invoke-WebRequest "https://aka.ms/vs/17/release/vs_enterprise.exe" -OutFile vs_enterprise.exe
      # 组件列表：https://docs.microsoft.com/en-us/visualstudio/install/workload-component-id-vs-enterprise?view=vs-2022
      # 命令行选项：https://docs.microsoft.com/en-us/visualstudio/install/use-command-line-parameters-to-install-visual-studio?view=vs-2022
      - name: 安装需要的组件
        run: |
          Start-Process -Wait vs_enterprise.exe -ArgumentList "--quiet", "--force", "--norestart", `
          "--add", "Microsoft.VisualStudio.Component.VC.CoreIde", `
          "--add", "Microsoft.VisualStudio.Component.IntelliCode", `
          "--add", "Microsoft.VisualStudio.Component.Windows10SDK", `
          "--add", "Microsoft.Component.VC.Runtime.UCRTSDK", `
          "--add", "Microsoft.VisualStudio.Component.VC.ATL", `
          "--add", "Microsoft.VisualStudio.Component.VC.ATLMFC", `
          "--add", "Microsoft.VisualStudio.Component.VC.14.29.16.11.MFC"
      - name: 设置 msbuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'   # 强制用 VS2022 的 msbuild：项目是 v143 工具集，VS2026(v18) 没有 v143 的 MFC 库（MSB8041）
      - name: 编译
        run: msbuild -t:Build '-p:Configuration=Release;platform=x86' -m:4
      - name: 上传编译产物（Artifacts，供手动运行时下载）
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer2.x86
          path: ./Release/MusicPlayer2.exe
      - name: 创建 Release（仅 tag 推送时触发）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 以官方最新 Release 的 x86 包为底包，仅替换 exe（与 x64 任务同理）
          $rel = Invoke-RestMethod "https://api.github.com/repos/zhongyang219/MusicPlayer2/releases/latest"
          $asset = $rel.assets | Where-Object { $_.name -like "*x86.zip" } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile official_x86.zip
          7z x official_x86.zip -opkg -y
          $exeDir = (Get-ChildItem pkg -Recurse -Filter MusicPlayer2.exe | Select-Object -First 1).DirectoryName
          Copy-Item ./Release/MusicPlayer2.exe "$exeDir/MusicPlayer2.exe" -Force
          # 注入自定义皮肤：紫色主题配置 + 背景图
          Copy-Item ./skin_config/config.ini "$exeDir/config.ini" -Force
          Copy-Item ./skin_config/purple_myth.png "$exeDir/purple_myth.png" -Force
          Push-Location pkg
          $name = Split-Path $exeDir -Leaf
          7z a -mx9 "..\MusicPlayer2-x86-$env:GITHUB_REF_NAME.zip" $name
          Pop-Location
          if (-not (gh release view "$env:GITHUB_REF_NAME" 2>$null)) {
            gh release create "$env:GITHUB_REF_NAME" "MusicPlayer2-x86-$env:GITHUB_REF_NAME.zip" --title "MusicPlayer2 $env:GITHUB_REF_NAME" --notes "基于官方最新底包，替换 exe 为自定义构建（炫紫神话皮肤）。" || gh release upload "$env:GITHUB_REF_NAME" "MusicPlayer2-x86-$env:GITHUB_REF_NAME.zip" --clobber
          } else {
            gh release upload "$env:GITHUB_REF_NAME" "MusicPlayer2-x86-$env:GITHUB_REF_NAME.zip" --clobber
          }
